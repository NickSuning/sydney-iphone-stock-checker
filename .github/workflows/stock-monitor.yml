name: Greater Sydney iPhone Duo stock alerts
on:
  schedule:
    # Standard GitHub UTC cron, every five minutes around the clock.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greater-sydney-iphone-duo-monitor
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Log workflow trigger
        run: echo "Workflow trigger = ${{ github.event_name }}; scheduled cron = ${{ github.event.schedule }}"
      - name: Check each Apple Store independently for exact-model stock and alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python stock_monitor.py
      - name: Persist last alerted store states
        if: always()
        run: |
          if test -f .stock_alert_state.json; then
            # Save the observation before refreshing the checkout.
            cp .stock_alert_state.json /tmp/iphone-alert-state.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4; do
              git fetch origin main
              # Only the runner checkout is reset. Never force-push the remote.
              git reset --hard origin/main
              cp /tmp/iphone-alert-state.json .stock_alert_state.json
              git add .stock_alert_state.json
              if git diff --cached --quiet; then
                echo "Alert state is already current"
                exit 0
              fi
              git commit -m "Update iPhone stock alert state [skip ci]"
              if git push origin HEAD:main; then
                echo "Alert state persisted"
                exit 0
              fi
              echo "Remote branch changed; retrying state-only commit ($attempt/4)"
              sleep 2
            done
            echo "::error::Could not persist alert state after four attempts"
            exit 1
          fi
