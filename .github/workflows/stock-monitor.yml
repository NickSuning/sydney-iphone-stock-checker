name: Greater Sydney iPhone Duo stock alerts
on:
  schedule:
    - cron: '2-59/5 7-21 * * *'
      timezone: 'Australia/Sydney'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greater-sydney-iphone-duo-monitor
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check each Apple Store independently for exact-model stock and alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python stock_monitor.py
      - name: Persist last alerted store states
        run: |
          if test -f .stock_alert_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .stock_alert_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update iPhone stock alert state [skip ci]"
              git push
            fi
          fi
